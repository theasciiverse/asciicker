# Builds the terminal Asciicker for the Asciiverse catalog: one archive per
# target, asciicker-<target>.tar.gz, plus SHA256SUMS, attached to a GitHub
# release (hub/catalog/SCHEMA.md, release.source = "github"). Runs on our
# tags (*-av.*), or by hand for an existing tag.
#
# Built by asciiverse/Makefile (QuickJS instead of V8, miniaudio instead of
# PulseAudio). Linux builds are glibc, not static musl, because miniaudio
# loads PulseAudio, PipeWire or ALSA at run time, which a static binary
# cannot do. They are built on Ubuntu 22.04 with libstdc++ linked in, so
# they run on glibc 2.35 and newer and need nothing else to start. macOS
# uses Core Audio through miniaudio. No Windows build: the terminal game
# is POSIX (termios, poll); upstream's Windows build is a GL window.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          make -f asciiverse/Makefile -j4 LDFLAGS="-static-libstdc++ -static-libgcc -s"
          file out/asciicker
          # nothing beyond libc, libm and libdl
          ldd out/asciicker
          ! ldd out/asciicker | grep -Eq 'libpulse|libasound|libstdc'
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          make -f asciiverse/Makefile -j4 CXX=clang++ CC=clang \
            CXXFLAGS="-O2 -arch ${{ matrix.arch }}" CFLAGS="-O2 -arch ${{ matrix.arch }}" \
            LDFLAGS="-arch ${{ matrix.arch }}"
          strip out/asciicker
          file out/asciicker
          otool -L out/asciicker
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "asciicker $TAG" \
                 --notes "asciicker $TAG, Marcin Sokalski's 3D ASCII action RPG, terminal edition with the changes in PATCHES.md, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
